name: Android Kotlin Compile Check

on:
  push:
    branches:
      - verify/android-kotlin-compile-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-check:
    name: Kotlin Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compile Release Kotlin
        working-directory: android
        run: ./gradlew :app:compileReleaseKotlin --no-daemon --stacktrace
